<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dịch giọng nói trực tiếp</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 900px; margin: 32px auto; padding: 0 18px; color: #17202a; }
    h1 { margin-bottom: 8px; }
    .controls, .card { border: 1px solid #d7dee8; border-radius: 12px; padding: 18px; margin: 16px 0; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    select, button { font: inherit; padding: 10px 14px; border-radius: 8px; }
    .speech-option { display: inline-flex; align-items: center; gap: 7px; }
    [hidden] { display: none !important; }
    .speech-option input { width: 18px; height: 18px; }
    button { border: 0; cursor: pointer; color: white; background: #1769d2; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    #stop { background: #b42318; }
    #status { color: #475467; }
    .label { font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: #667085; }
    .text { min-height: 54px; white-space: pre-wrap; line-height: 1.55; font-size: 1.08rem; }
    #translated { color: #075e3c; }
    #error { color: #b42318; white-space: pre-wrap; }
    .hint { color: #667085; font-size: .92rem; }
    #vadStatus { margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Dịch giọng nói trực tiếp</h1>
  <p class="hint">Cho phép trình duyệt dùng microphone. Bản dịch sẽ luôn hiển thị bằng chữ. Chỉ bật phát giọng nói nếu bạn muốn nghe bản dịch.</p>
  <p class="hint" id="sessionIdHint"></p>

  <div class="controls">
    <label for="target">Dịch sang</label>
    <select id="target">
      <option value="vi">Tiếng Việt</option>
      <option value="en">English</option>
    </select>
    <label class="speech-option" for="speechToggle">
      <input id="speechToggle" type="checkbox">
      Phát bản dịch bằng giọng nói
    </label>
    <button id="start">Bắt đầu</button>
    <button id="stop" disabled>Dừng</button>
    <label class="speech-option" id="continueOption" hidden>
      <input id="continueFragment" type="checkbox" checked>
      Nối tiếp đoạn nói dở
    </label>
    <span id="status">Chưa kết nối</span>
  </div>
  <div id="vadStatus" class="hint" aria-live="polite">Chẩn đoán khoảng nghỉ: chưa bắt đầu.</div>

  <div class="card">
    <div class="label">Lời nói được nhận dạng</div>
    <div id="source" class="text"></div>
  </div>
  <div class="card">
    <div class="label">Bản dịch</div>
    <div id="translated" class="text"></div>
  </div>
  <div id="error"></div>

  <script>
    const startButton = document.getElementById('start');
    const stopButton = document.getElementById('stop');
    const targetSelect = document.getElementById('target');
    const speechToggle = document.getElementById('speechToggle');
    const sessionIdHint = document.getElementById('sessionIdHint');
    const pageParams = new URLSearchParams(location.search);
    const pageSessionId = pageParams.get('session_id');
    const requestedActivityMode = pageParams.get('provider_activity_mode');
    const providerActivityMode = ['automatic', 'hybrid'].includes(requestedActivityMode)
      ? requestedActivityMode : 'manual';
    sessionIdHint.textContent = pageSessionId
      ? `session_id của lượt thử: ${pageSessionId}; Gemini VAD: ${providerActivityMode}`
      : 'Chưa có session_id trong địa chỉ trang.';
    const statusEl = document.getElementById('status');
    const sourceEl = document.getElementById('source');
    const translatedEl = document.getElementById('translated');
    const errorEl = document.getElementById('error');
    const vadStatusEl = document.getElementById('vadStatus');
    const continueOption = document.getElementById('continueOption');
    const continueFragment = document.getElementById('continueFragment');

    let socket;
    let audioContext;
    let microphone;
    let mediaStream;
    let processor;
    let muteGain;
    let sourceBuffer = '';
    let translatedBuffer = '';
    let sourcePreview = '';
    let translatedPreview = '';
    let savedSegments = [];
    let pcmBuffer = [];
    let nextPlaybackTime = 0;
    let stopFallbackTimer;
    const activeAudioSources = new Set();

    function setRunning(running) {
      startButton.disabled = running;
      stopButton.disabled = !running;
      targetSelect.disabled = running;
    }

    function appendText(which, text) {
      if (!text) return;
      if (which === 'source') {
        sourceBuffer += text;
      } else {
        translatedBuffer += text;
      }
      renderTranscript();
    }

    function transcriptTokens(text) {
      return (text.toLocaleLowerCase().match(/[\p{L}\p{N}]+/gu) || []);
    }

    function isLongTokenPrefix(prefixTokens, valueTokens) {
      return prefixTokens.length >= 4 &&
        prefixTokens.length <= valueTokens.length &&
        prefixTokens.every((token, index) => token === valueTokens[index]);
    }

    function mergeDisplayedTranscript(base, snapshot) {
      if (!base) return snapshot;
      if (!snapshot) return base;
      const baseTokens = transcriptTokens(base);
      const snapshotTokens = transcriptTokens(snapshot);
      if (isLongTokenPrefix(baseTokens, snapshotTokens)) return snapshot;
      if (isLongTokenPrefix(snapshotTokens, baseTokens)) return base;
      return `${base}\n${snapshot}`;
    }

    function renderTranscript() {
      sourceEl.textContent = mergeDisplayedTranscript(sourceBuffer, sourcePreview);
      translatedEl.textContent = mergeDisplayedTranscript(translatedBuffer, translatedPreview);
    }

    function rebuildSavedText() {
      sourceBuffer = savedSegments.map((segment) => segment.source_text || '')
        .filter(Boolean).join('\n');
      translatedBuffer = savedSegments.map((segment) => {
        const value = segment.source_language === 'en' ? segment.vn : segment.en;
        return segment.status === 'fragment' && value ? `[Tạm] ${value}` : value;
      }).filter(Boolean).join('\n');
      renderTranscript();
    }

    function commitSegment(message) {
      const index = savedSegments.findIndex((item) => item.segment_id === message.segment_id);
      if (index >= 0) savedSegments[index] = message;
      else savedSegments.push(message);
      savedSegments.sort((a, b) => a.sequence_number - b.sequence_number);
      sourcePreview = '';
      translatedPreview = '';
      rebuildSavedText();
    }

    function sendPcmChunk(samples) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      const pcm = new Int16Array(samples.length);
      for (let i = 0; i < samples.length; i++) {
        const value = Math.max(-1, Math.min(1, samples[i]));
        pcm[i] = value < 0 ? value * 32768 : value * 32767;
      }
      socket.send(pcm.buffer);
    }

    function flushPcmBuffer() {
      if (pcmBuffer.length) sendPcmChunk(pcmBuffer.splice(0));
    }

    function downsampleAndSend(input, inputRate) {
      const ratio = inputRate / 16000;
      const outputCount = Math.floor(input.length / ratio);
      for (let i = 0; i < outputCount; i++) {
        const position = i * ratio;
        const left = Math.floor(position);
        const fraction = position - left;
        const right = Math.min(left + 1, input.length - 1);
        pcmBuffer.push(input[left] * (1 - fraction) + input[right] * fraction);
      }

      while (pcmBuffer.length >= 1600) {
        sendPcmChunk(pcmBuffer.splice(0, 1600));
      }
    }

    function playPcmBase64(encoded) {
      if (!speechToggle.checked || !audioContext || audioContext.state === 'closed') return;
      const binary = atob(encoded);
      const sampleCount = Math.floor(binary.length / 2);
      if (!sampleCount) return;
      const buffer = audioContext.createBuffer(1, sampleCount, 24000);
      const channel = buffer.getChannelData(0);
      const view = new DataView(new ArrayBuffer(binary.length));
      for (let i = 0; i < binary.length; i++) {
        view.setUint8(i, binary.charCodeAt(i));
      }
      for (let i = 0; i < sampleCount; i++) {
        channel[i] = view.getInt16(i * 2, true) / 32768;
      }
      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioContext.destination);
      activeAudioSources.add(source);
      source.onended = () => activeAudioSources.delete(source);
      const startAt = Math.max(audioContext.currentTime + 0.03, nextPlaybackTime);
      source.start(startAt);
      nextPlaybackTime = startAt + buffer.duration;
    }

    function handleServerMessage(event) {
      if (event.target !== socket) return;
      const message = JSON.parse(event.data);
      if (message.type === 'input_partial') {
        sourcePreview = message.text || '';
        renderTranscript();
      }
      if (message.type === 'output_partial') {
        translatedPreview = message.text || '';
        renderTranscript();
      }
      if (message.type === 'input_transcription') appendText('source', message.text);
      if (message.type === 'output_transcription') appendText('translated', message.text);
      if (message.type === 'segment_final') commitSegment(message);
      if (message.type === 'translated_audio') playPcmBase64(message.data);
      if (message.type === 'vad_diagnostic') {
        const speaking = message.speech_active
          ? 'đang phát hiện tiếng nói'
          : message.speech_candidate_ms > 0
            ? 'đang xác nhận tiếng nói'
            : 'đang chờ tiếng nói';
        vadStatusEl.textContent =
          `Khoảng nghỉ: ${speaking}; RMS ${message.rms} / ngưỡng ${message.threshold}; ` +
          `im lặng ${message.silence_progress_ms}/${message.required_silence_ms} ms.`;
      }
      if (message.type === 'speech_pause_detected') {
        vadStatusEl.textContent =
          `Đã phát hiện khoảng nghỉ #${message.pause_number} (${message.silence_ms} ms); ` +
          'đang chờ transcript ổn định để lưu segment.';
      }
      if (message.type === 'segment_final') {
        vadStatusEl.textContent = message.status === 'fragment'
          ? `Đã giữ nguyên đoạn nói dở #${message.sequence_number}; chưa chốt bản dịch.`
          : message.source_confirmed_without_punctuation
          ? `Đã lưu segment #${message.sequence_number}; xác nhận câu nói thiếu dấu câu cuối sau khi dừng.`
          : message.translation_recovered
            ? `Đã lưu segment #${message.sequence_number}; đã hoàn chỉnh bản dịch sau khi dừng.`
            : `Đã lưu segment #${message.sequence_number} (${message.status}).`;
      }
      if (message.type === 'stop_draining') {
        statusEl.textContent = 'Đang chờ xử lý phần cuối…';
        vadStatusEl.textContent = message.message || 'Đang chờ transcript cuối.';
      }
      if (message.type === 'error') {
        errorEl.textContent = message.message;
        statusEl.textContent = 'Đã dừng';
      }
      if (message.type === 'session_complete' || message.type === 'stream_stopped') {
        clearTimeout(stopFallbackTimer);
        sourcePreview = '';
        translatedPreview = '';
        renderTranscript();
        statusEl.textContent = 'Đã dừng';
        if (message.type === 'stream_stopped') {
          vadStatusEl.textContent =
            `Đã dừng: phát hiện ${message.pauses_detected} khoảng nghỉ; ` +
            `VAD chốt ${message.vad_finalized_segments} segment, ` +
            `gộp ${message.vad_merged_pauses} khoảng nghỉ; ` +
            `chờ transcript yên ${message.segment_settle_ms} ms; ` +
            `Gemini hoàn tất phát sinh ${message.provider_generation_completions} lần, ` +
            `kết thúc ${message.provider_turn_completions} lượt; ` +
            `bản dịch báo xong ${message.output_finished_events} lần; ` +
            `có mốc thời gian ${message.input_timing_events}/${message.output_timing_events} lần; ` +
            `nhận ${message.input_transcription_events} mảnh tiếng gốc, ` +
            `${message.input_interim_events ?? 0} bản tạm tiếng gốc, ` +
            `giữ đuôi bản tạm ${message.source_preview_tail_preservations ?? 0} lần; ` +
            `${message.output_transcription_events} mảnh bản dịch; ` +
            `thay snapshot lũy tiến ${message.source_snapshot_replacements} lần, ` +
            `bỏ snapshot cũ ${message.stale_source_snapshots_ignored} lần; ` +
            `chờ cuối ${message.stop_drain_elapsed_ms} ms (${message.stop_drain_reason}); ` +
            `hoàn chỉnh lại ${message.translation_repairs} bản dịch; ` +
            `xác nhận ${message.stop_source_confirmations ?? 0} câu thiếu dấu câu cuối; ` +
            `đã lưu ${message.segments_saved} segment, ` +
            `trong đó ${message.fragments_saved ?? 0} đoạn nói dở.`;
        }
        const finishedSocket = socket;
        socket = null;
        cleanupAudio();
        setRunning(false);
        if (finishedSocket && finishedSocket.readyState < WebSocket.CLOSING) {
          finishedSocket.close(1000, 'Session complete');
        }
      }
    }

    function stopMicrophoneCapture() {
      if (processor) processor.disconnect();
      if (microphone) microphone.disconnect();
      if (muteGain) muteGain.disconnect();
      if (mediaStream) mediaStream.getTracks().forEach((track) => track.stop());
      processor = microphone = muteGain = mediaStream = null;
      pcmBuffer = [];
    }

    function cleanupAudio() {
      stopMicrophoneCapture();
      if (audioContext && audioContext.state !== 'closed') audioContext.close();
      audioContext = null;
    }

    async function startTranslation() {
      const sessionId = pageSessionId;
      if (!sessionId) { errorEl.textContent = 'Mở trang với ?session_id=...'; return; }
      errorEl.textContent = '';
      vadStatusEl.textContent = 'Đang đo âm thanh microphone…';
      sourcePreview = '';
      translatedPreview = '';
      nextPlaybackTime = 0;
      setRunning(true);
      statusEl.textContent = 'Đang tải lại transcript đã lưu…';

      try {
        const transcriptResponse = await fetch(
          `/api/v1/sessions/${encodeURIComponent(sessionId)}/transcript`
        );
        if (!transcriptResponse.ok) {
          throw new Error('Không tải được transcript đã lưu cho phiên này.');
        }
        const transcript = await transcriptResponse.json();
        savedSegments = transcript.segments || [];
        rebuildSavedText();
        const lastSegment = savedSegments.at(-1);
        const sourceLanguage = targetSelect.value === 'en' ? 'vi' : 'en';
        continueOption.hidden = !lastSegment || lastSegment.status !== 'fragment' ||
          lastSegment.source_language !== sourceLanguage;
        vadStatusEl.textContent =
          `Đã khôi phục ${savedSegments.length} segment đã lưu; ` +
          'đang xin quyền microphone…';

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        mediaStream = stream;
        audioContext = new AudioContext();
        await audioContext.resume();

        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${protocol}//${location.host}/api/v1/live-sessions/${encodeURIComponent(sessionId)}`);
        const currentSocket = socket;
        currentSocket.onopen = () => {
          if (socket !== currentSocket) return;
          currentSocket.send(JSON.stringify({
            type: 'start',
            target_language_code: targetSelect.value,
            continue_fragment: !continueOption.hidden && continueFragment.checked,
            speech_output_enabled: speechToggle.checked,
            provider_activity_mode: providerActivityMode
          }));
          microphone = audioContext.createMediaStreamSource(stream);
          processor = audioContext.createScriptProcessor(4096, 1, 1);
          muteGain = audioContext.createGain();
          muteGain.gain.value = 0;
          processor.onaudioprocess = (event) => {
            downsampleAndSend(event.inputBuffer.getChannelData(0), audioContext.sampleRate);
          };
          microphone.connect(processor);
          processor.connect(muteGain);
          muteGain.connect(audioContext.destination);
          statusEl.textContent = 'Đang nghe và dịch trực tiếp…';
        };
        currentSocket.onmessage = handleServerMessage;
        currentSocket.onerror = () => {
          if (socket !== currentSocket) return;
          errorEl.textContent = 'Không kết nối được WebSocket. Kiểm tra server và thử lại.';
          statusEl.textContent = 'Mất kết nối';
          socket = null;
          clearTimeout(stopFallbackTimer);
          cleanupAudio();
          setRunning(false);
          if (currentSocket.readyState < WebSocket.CLOSING) currentSocket.close();
        };
        currentSocket.onclose = () => {
          if (socket !== currentSocket) return;
          socket = null;
          clearTimeout(stopFallbackTimer);
          cleanupAudio();
          setRunning(false);
          if (statusEl.textContent.includes('Đang')) statusEl.textContent = 'Đã ngắt kết nối';
        };
      } catch (error) {
        cleanupAudio();
        setRunning(false);
        statusEl.textContent = 'Không thể bắt đầu';
        errorEl.textContent = error.message || String(error);
      }
    }

    function stopTranslation() {
      statusEl.textContent = 'Đang kết thúc lượt dịch…';
      flushPcmBuffer();
      if (socket && socket.readyState === WebSocket.OPEN) {
        const stoppingSocket = socket;
        stopMicrophoneCapture();
        socket.send(JSON.stringify({ type: 'stop' }));
        clearTimeout(stopFallbackTimer);
        stopFallbackTimer = setTimeout(() => {
          if (socket !== stoppingSocket) return;
          statusEl.textContent = 'Đã dừng';
          socket = null;
          cleanupAudio();
          setRunning(false);
          stoppingSocket.close(1000, 'Stop timeout');
        }, 90000);
      } else {
        if (socket && socket.readyState < WebSocket.CLOSING) socket.close();
        socket = null;
        cleanupAudio();
        setRunning(false);
      }
    }

    startButton.addEventListener('click', startTranslation);
    stopButton.addEventListener('click', stopTranslation);
    speechToggle.addEventListener('change', async () => {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          type: 'set_speech_output', enabled: speechToggle.checked
        }));
      }
      if (speechToggle.checked && audioContext && audioContext.state === 'suspended') {
        try { await audioContext.resume(); } catch (_) { /* Browser may block playback until a user gesture. */ }
      }
      if (!speechToggle.checked) {
        for (const source of activeAudioSources) {
          try { source.stop(); } catch (_) { /* Source may have already ended. */ }
        }
        activeAudioSources.clear();
        if (audioContext && audioContext.state !== 'closed') {
          nextPlaybackTime = audioContext.currentTime;
        }
      }
    });
  </script>
</body>
</html>
